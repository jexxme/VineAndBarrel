pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        exclusiveContent {
            forRepository { maven { name = 'Fabric'; url = 'https://maven.fabricmc.net' } }
            filter { includeGroupAndSubgroups('net.fabricmc') }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'vine-and-barrel'

// One mod, two loaders (the MultiLoader layout): common holds everything that only needs vanilla Minecraft and is
// compiled into both loader jars; neoforge and fabric hold the loader glue (entry points, events, capabilities,
// configs, data generation on NeoForge). Convention plugins in build-logic.
includeBuild('build-logic')
include('common')
include('neoforge')
include('fabric')
