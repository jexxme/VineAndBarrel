# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft
minecraft_version=26.1.1
minecraft_version_range=[26.1,26.1.2)
# Minecraft versions this jar is published for (comma separated), used by the release workflow
release_game_versions=26.1,26.1.1
neo_version=26.1.1.15-beta
neo_version_range=[26.1.0.19-beta,26.1.2)
loader_version_range=[4,)

# Optional integrations (compile-only APIs, present in dev runs)
jei_minecraft=26.1.1
jei_version=29.4.0.23
jade_version=26.1.1+neoforge

# Mod Info
mod_version=0.9.0-playtest.1
mod_id=vineandbarrel
mod_name=Vine & Barrel
mod_license=MIT License
mod_authors=Jexxme
mod_description=A cozy wine and beer mod in the spirit of Farmer's Delight. Grow grapes, hops and barley, brew in a copper kettle, let it ferment and age in barrels, and tap mugs and glasses for your friends. Works on its own and feels like part of Farmer's Delight when both are installed.
