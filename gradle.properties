# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
# Minecraft versions this jar is published for (comma separated), used by the release workflow
release_game_versions=1.20.1
forge_version=47.4.29
forge_version_range=[47.3,)
loader_version_range=[47,)
# Fabric, see https://fabricmc.net/develop/
# The dev runs' loader: the lowest line the dev runs' mods accept (JEI 15.74 for Fabric needs 0.19.4, Farmer's Delight
# Refabricated 2.5.7 needs 0.18.2; Fabric API 0.92.12 and our own jar only need 0.16.10, see below)
fabric_loader_version=0.19.5
# The oldest Fabric Loader the Fabric jar runs on (fabric.mod.json)
fabric_loader_min_version=0.16.10
fabric_api_version=0.92.12+1.20.1

# Optional integrations (compile-only APIs, present in dev runs)
jei_minecraft=1.20.1
jei_version=15.74.0.234
# JEI's config library (JEI 15.74 needs 0.6.10 or newer and carries it as a jar in its jar), for the Fabric dev runs only
mezz_config_version=0.7.1
jade_version=11.13.3+forge
jade_fabric_version=11.13.3+fabric
# Mod Menu (Fabric): optional, compile-only, for the config screen entry
modmenu_version=7.2.2
# Farmer's Delight (the original mod's Forge build) for the Forge FD GameTest run and the playtest only: its version
# and its Modrinth version id
farmers_delight_version=1.20.1-1.3.4
farmers_delight_modrinth=SiIpcZzM
# Farmer's Delight Refabricated (the Fabric port of FD, same mod id farmersdelight), for the Fabric FD GameTest run only
fd_refabricated_version=1.20.1-2.5.7
appleskin_version=mc1.20.1-2.5.1
# AppleSkin's last Fabric build for 1.20.1, and the Cloth Config it carries as a jar in its jar (for the Fabric dev runs)
appleskin_fabric_version=mc1.20.1-2.5.2
cloth_config_fabric_version=11.1.136+fabric

# Data-driven integrations (thirst, nutrition): we ship data files for them, never code. The compat GameTest run
# (runGameTestServerCompat) loads exactly these builds, and only its test probes compile against them. Each mod has its
# version as the mod itself reports it (the wiki shows it, the compat run checks it) and its Modrinth version id, which
# the build uses because some of these mods give their Fabric and Forge files the same version number.
tough_as_nails_version=9.2.0.171
tough_as_nails_modrinth=kWVOI0iS
# GlitchCore 0.0.1.1, which Tough As Nails needs
glitchcore_modrinth=pYPZ5MNI
homeostatic_version=2.9.16.2
homeostatic_modrinth=lxSJN2lX
thirst_was_taken_version=1.10.1+1.20.1-forge
thirst_was_taken_modrinth=tzP3IWuw
# Spice of Life Onion needs nothing from us; the compat run checks that it counts our meals
spice_of_life_version=1.4.5
spice_of_life_modrinth=kMmavFVY
# CreativeCore 2.12.42, which Spice of Life Onion needs
creativecore_modrinth=HGkNDl47
# The same mods' Fabric files for the Fabric compat run. The versions are the ones each mod reports on Fabric.
tough_as_nails_fabric_modrinth=VaFrDMPi
glitchcore_fabric_modrinth=25HLOiOl
homeostatic_fabric_modrinth=pzJh0p9r
thirst_was_taken_fabric_modrinth=AB13yaa5
# Spice of Life Onion has no Fabric build for this Minecraft, and its Forge jar (SRG names) can't be compiled against on
# Fabric: the Fabric build doesn't use it

# Mod Info
# The Forge version, and the Fabric version (the same version before the "+"; the release workflow checks both)
mod_version=1.1.1+forge.1
fabric_mod_version=1.1.1+fabric.1
mod_id=vineandbarrel
mod_name=Vine & Barrel
mod_license=MIT License
mod_authors=Jexxme
mod_description=A cozy brewing mod: beer, wine, mead and cider. Grow grapes, hops and barley, brew in a copper kettle, let it ferment and age in barrels, and tap mugs and glasses for your friends. Farmer's Delight is an optional extra that fits right in.
