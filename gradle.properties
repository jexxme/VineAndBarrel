# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
# Minecraft versions this jar is published for (comma separated), used by the release workflow
release_game_versions=1.21.1
neo_version=21.1.266
neo_version_range=[21.1.205,)
loader_version_range=[4,)
# The vanilla game the common project compiles against (NeoForm, without NeoForge): https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# Fabric, see https://fabricmc.net/develop/
# The dev runs use the loader line most 1.21.1 packs run (0.16: it brings MixinExtras 0.4.1), so the tests see what
# players have; the newest loader also fails to remap Farmer's Delight Refabricated in a dev run
fabric_loader_version=0.19.5
# The oldest Fabric Loader the Fabric jar runs on (fabric.mod.json)
fabric_loader_min_version=0.16.10
fabric_api_version=0.116.18+1.21.1

# Optional integrations (compile-only APIs, present in dev runs)
jei_minecraft=1.21.1
jei_version=19.70.0.469
# JEI's config library, for the Fabric dev runs only
mezz_config_version=0.7.1
jade_version=15.10.6+neoforge
jade_fabric_version=15.10.6+fabric
# Mod Menu (Fabric): optional, compile-only, for the config screen entry
modmenu_version=11.0.5
# Farmer's Delight (the original mod's NeoForge build) for the NeoForge FD GameTest run and the playtest only: its version
# and its Modrinth version id
farmers_delight_version=1.21.1-1.3.4
farmers_delight_modrinth=XTVZDOol
# Farmer's Delight Refabricated (the Fabric port of FD, same mod id farmersdelight), for the Fabric FD GameTest run only
fd_refabricated_version=1.21.1-3.3.6
appleskin_version=mc1.21-3.0.9
# AppleSkin's last Fabric build for 1.21.1
appleskin_fabric_version=mc1.21-3.0.6

# Data-driven integrations (thirst, nutrition): we ship data files for them, never code. The compat GameTest run
# (runGameTestServerCompat) loads exactly these builds, and only its test probes compile against them. Each mod has its
# version as the mod itself reports it (the wiki shows it, the compat run checks it) and its Modrinth version id, which
# the build uses because some of these mods give their Fabric and NeoForge files the same version number.
tough_as_nails_version=10.1.0.13
tough_as_nails_modrinth=mboAbksk
# GlitchCore 2.1.0.2, which Tough As Nails needs
glitchcore_modrinth=S2TfWrZR
homeostatic_version=2.12.1.0
homeostatic_modrinth=PXGinPR3
thirst_was_taken_version=1.10.1+1.21.1-neoforge
thirst_was_taken_modrinth=xY0rXbw5
nutritional_balance_version=1.21.1-7.0.3
nutritional_balance_modrinth=Sjl3mj3B
# Spice of Life Onion needs nothing from us; the compat run checks that it counts our meals
spice_of_life_version=1.5.7
spice_of_life_modrinth=PtXSNLlv
# CreativeCore 2.13.54, which Spice of Life Onion needs
creativecore_modrinth=v8QrwctR
# The same mods' Fabric files for the Fabric compat run (Nutritional Balance has no Fabric build). The versions are the
# ones each mod reports on Fabric.
tough_as_nails_fabric_modrinth=dLxSK1xF
glitchcore_fabric_modrinth=sux8kYHe
homeostatic_fabric_modrinth=VNGWDoPz
thirst_was_taken_fabric_modrinth=NdKE8odb
# Spice of Life Onion has no Fabric build for this Minecraft; its NeoForge jar only compiles the probe (fabric/build.gradle)

# Mod Info
# The NeoForge version, and the Fabric version (the same version before the "+"; the release workflow checks both)
mod_version=1.2.0+neoforged.1
fabric_mod_version=1.2.0+fabric.1
mod_id=vineandbarrel
mod_name=Vine & Barrel
mod_license=MIT License
mod_authors=Jexxme
mod_description=A cozy brewing mod: beer, wine, mead and cider. Grow grapes, hops and barley, brew in a copper kettle, let it ferment and age in barrels, and tap mugs and glasses for your friends. Farmer's Delight is an optional extra that fits right in.
