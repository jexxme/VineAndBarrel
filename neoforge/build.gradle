// Vine & Barrel on NeoForge: the common sources plus the NeoForge glue (entry point, events, capabilities, configs,
// data maps, biome modifier, loot modifiers) and the data generators. All run tasks of the single-loader days live here.
plugins {
    id 'vb-loader'
    id 'net.neoforged.moddev'
}

// Test-only data for the GameTest server run only (see neoForge.mods), never packed into the jar. It stands in for optional mods, e.g. it puts
// a vanilla block into #farmersdelight:ropes so rope climbing is tested without Farmer's Delight on the classpath.
// Shared with Fabric: it lives in common/src/gametest.
sourceSets {
    gametest {
        resources.srcDir project(':common').file('src/gametest/resources')
    }
}

def commonResourcesDir = project(':common').file('src/main/resources')
def generatedResourcesDir = project(':common').file('src/generated/resources')

// Which of this mod's GameTests the GameTest runs take: all of them, or with -Ptests=<pattern> only those whose name
// matches, for a quick look at one area while working on it (./gradlew :neoforge:runGameTestServer -Ptests='blackout_*').
// The compat run always takes its own tests. verify-all.sh never passes it.
def gameTests = providers.gradleProperty('tests').getOrElse('*')

neoForge {
    version = project.neo_version
    accessTransformers.from(commonResourcesDir.toPath().resolve('META-INF/accesstransformer.cfg').toFile().absolutePath)

    // Two views of the same mod (one mods.toml): the real one, and one with the test-only data from src/gametest on
    // top. Only the GameTest server loads the second, so dev clients and servers play exactly what the jar ships.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_gametest" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Headless: boots a GameTest server, runs every test of this mod, exits. No window, safe to run any time.
        // This is THE test entry point, locally and in CI: ./gradlew :neoforge:runGameTestServer
        gameTestServer {
            type = "gameTestServer"
            // Only this mod's GameTests (vanilla's --tests selector): another mod's jar in the run can carry its own, and
            // neoforge.enabledGameTestNamespaces no longer filters anything since the 26.x GameTest registry.
            programArguments.addAll '--tests', "${project.mod_id}:${gameTests}"
            systemProperty 'vineandbarrel.testReport', file('build/test-reports/gametest.xml').absolutePath // for the parity checklist
        }

        // The same GameTests with Farmer's Delight installed: ./gradlew runGameTestServerFd (headless too). FD is never on
        // the compile classpath; its jar is copied into this run's own mods folder (run-fd/mods), so the normal
        // gameTestServer run stays FD-free. Every FD hook is tested in both runs (see FdCompatGameTests).
        gameTestServerFd {
            type = "gameTestServer"
            gameDirectory = project.file('run-fd')
            // Only this mod's GameTests (vanilla's --tests selector): another mod's jar in the run can carry its own, and
            // neoforge.enabledGameTestNamespaces no longer filters anything since the 26.x GameTest registry.
            programArguments.addAll '--tests', "${project.mod_id}:${gameTests}"
            systemProperty 'vineandbarrel.expectFd', 'true' // fd_run_has_the_right_mods fails if FD did not load
            systemProperty 'vineandbarrel.testReport', file('build/test-reports/gametest-fd.xml').absolutePath
        }

        // The compat GameTests with the thirst and nutrition mods we ship data for (Tough As Nails, Homeostatic, Thirst Was
        // Taken 2, Nutritional Balance) and Spice of Life Onion: ./gradlew runGameTestServerCompat (headless too). They are
        // never on the dev runs' classpath; their jars are copied into this run's own mods folder (run-compat/mods).
        // The compat tests ask each mod itself what it read from our data (see ModCompatGameTests). Only those run here:
        // the other tests' fake players have no network channels, and these mods sync their data to every player.
        gameTestServerCompat {
            type = "gameTestServer"
            gameDirectory = project.file('run-compat')
            programArguments.addAll '--tests', "${project.mod_id}:compat_*"
            systemProperty 'vineandbarrel.expectCompat', 'true' // compat_run_has_the_right_mods fails if one did not load
            // ...or if one is not the version gradle.properties (and so the wiki) names
            systemProperty 'vineandbarrel.compatVersions', [
                toughasnails: project.tough_as_nails_version, homeostatic: project.homeostatic_version,
                thirstwastaken2: project.thirst_was_taken_version, nutritionalbalance: project.nutritional_balance_version,
                solonion: project.spice_of_life_version,
            ].collect { id, version -> "${id}=${version}" }.join(',')
            systemProperty 'vineandbarrel.testReport', file('build/test-reports/gametest-compat.xml').absolutePath
        }

        // Writes the runtime values the wiki reads (site/src/data/runtime.json): ./gradlew runDocsExport. Headless.
        // Only the exporter runs there (see VBDocsExport), so it never appears in the normal GameTest results.
        docsExport {
            type = "gameTestServer"
            gameDirectory = project.file('run/docs-export')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'vineandbarrel.docsExport', rootProject.file('site/src/data/runtime.json').getAbsolutePath()
        }

        // A local playtest server: ./gradlew runPlaytest. Farmer's Delight, JEI and Jade loaded, the showcase world, bound
        // to 127.0.0.1 in offline mode. Join with ./gradlew runPlaytestClient (its own folder with FD, so the FD-free
        // GameTest run in run/ never sees FD) or any NeoForge client with the same mods. See preparePlaytest.
        playtest {
            server()
            gameDirectory = project.file('run/playtest')
            programArgument '--nogui'
        }

        playtestClient {
            client()
            gameDirectory = project.file('run/playtest-client')
            programArguments.addAll '--username', 'Jexxme', '--quickPlayMultiplayer', '127.0.0.1:25565'
        }

        // Writes common/src/generated/resources (shared by both loaders): ./gradlew runData
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file(project.findProperty('datagenOutput') ?: generatedResourcesDir).getAbsolutePath(), '--existing', commonResourcesDir.getAbsolutePath()
        }

        configureEach { run ->
            loadedMods = run.name.startsWith('gameTestServer') ? [neoForge.mods.named("${mod_id}_gametest").get()]
                    : [neoForge.mods.named(mod_id).get()]
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // The mod jars for runGameTestServerCompat (see prepareCompatRun): resolved on their own, never on a classpath
    compatMods { transitive = false }
}

dependencies {
    // JEI and Jade: optional at runtime. Their APIs are compile-only; the integrations live in compat/jei and compat/jade,
    // which only those mods load (@JeiPlugin, @WailaPlugin). Both are in every dev run, so the GameTest runs boot with them.
    compileOnly "mezz.jei:jei-${jei_minecraft}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${jei_minecraft}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    // AppleSkin: optional at runtime, set up like JEI and Jade. Only its API is compiled against (compat/appleskin, which
    // only loads when AppleSkin is installed); it is in every dev run, so the GameTests check the hook for real.
    compileOnly "squeek.appleskin:appleskin-neoforge:${appleskin_version}:api"
    localRuntime "squeek.appleskin:appleskin-neoforge:${appleskin_version}"

    // Thirst and nutrition mods: Vine & Barrel ships plain data for them (tags and JSON, generated in compat/), no code.
    // Only the GameTest probes compile against them (gametest/ModCompatGameTests' nested *Probe classes, loaded only in
    // the compat run where these mods are installed). They stay off the dev runs' classpath: see runGameTestServerCompat.
    def compatJars = [
        "maven.modrinth:tough-as-nails:${tough_as_nails_modrinth}",
        "maven.modrinth:glitchcore:${glitchcore_modrinth}",
        "maven.modrinth:homeostatic:${homeostatic_modrinth}",
        "maven.modrinth:thirst-was-taken-2:${thirst_was_taken_modrinth}",
        "maven.modrinth:nutritional-balance:${nutritional_balance_modrinth}",
        "maven.modrinth:spice-of-life-onion:${spice_of_life_modrinth}",
        "maven.modrinth:creativecore:${creativecore_modrinth}",
    ]
    compatJars.each { compileOnly it; compatMods it }
}

// The Farmer's Delight jar for runGameTestServerFd, a built FD Neoforged jar (MIT). Pass -PfdJar=<path> or set FD_JAR;
// otherwise the build output of the FD Neoforged project next to this one (../Season4/farmersdelight-port, also looked
// up three folders further up, for a checkout nested inside this one) is used. Run it with
// `./gradlew runGameTestServerFd`, or all runs with `./gradlew :neoforge:gameTestsAll`.
def fdProjectDir = rootDir // plain values only: these closures also run at execution time (configuration cache)
def fdRootDir = rootDir
def fdJarFile = providers.gradleProperty('fdJar').orElse(providers.environmentVariable('FD_JAR')).map { String path ->
    def jar = new File(path)
    jar.isAbsolute() ? jar : new File(fdProjectDir, path)
}.orElse(provider {
    def roots = [fdRootDir.parentFile, fdRootDir.parentFile?.parentFile?.parentFile?.parentFile].findAll { it != null }
    def found = roots.collect { new File(it, 'Season4/farmersdelight-port/build/libs') }
            .findAll { it.isDirectory() }
            .collectMany { dir -> (dir.listFiles() ?: []).findAll { it.name.startsWith('FarmersDelight') && it.name.endsWith('.jar') && !it.name.contains('-sources') } }
            .sort { -it.lastModified() }
    found ? found.first() : new File(fdProjectDir, 'fd-jar-not-found.jar')
})
ext.fdJarFile = fdJarFile // for other scripts applied to this project

// Always runs (no inputs or outputs), so a missing jar fails the FD run with this message. A check inside the Sync
// below would be skipped: Gradle skips a Sync with no source files (NO-SOURCE), and the server would start without FD.
def verifyFdJar = tasks.register('verifyFdJar') {
    group = 'verification'
    description = "Fails unless the Farmer's Delight jar for runGameTestServerFd exists."
    def jar = fdJarFile
    doLast {
        if (!jar.get().isFile()) {
            throw new GradleException("No Farmer's Delight jar for the FD GameTest run: ${jar.get()}. Build FD Neoforged (./gradlew jar there) or pass -PfdJar=<path to the jar>.")
        }
    }
}

def prepareFdRun = tasks.register('prepareFdRun', Sync) {
    group = 'verification'
    description = "Copies the Farmer's Delight jar into run-fd/mods for runGameTestServerFd."
    dependsOn verifyFdJar
    from(fdJarFile)
    into(layout.projectDirectory.dir('run-fd/mods'))
}

tasks.matching { it.name == 'runGameTestServerFd' }.configureEach {
    dependsOn prepareFdRun
}

// The compat run's mods folder holds exactly the jars of the compatMods configuration (versions in gradle.properties)
def prepareCompatRun = tasks.register('prepareCompatRun', Sync) {
    group = 'verification'
    description = 'Copies the thirst and nutrition mods into run-compat/mods for runGameTestServerCompat.'
    from(configurations.compatMods)
    into(layout.projectDirectory.dir('run-compat/mods'))
}

tasks.matching { it.name == 'runGameTestServerCompat' }.configureEach {
    dependsOn prepareCompatRun
}

// The playtest server and the dev client both need FD (it adds registries). server.properties is only written once, so
// changes made for a playtest stay; the EULA is never accepted here, that is the player's own call (run/playtest/eula.txt).
def playtestDir = project.file('run/playtest')
def devClientMods = project.file('run/playtest-client/mods')
def preparePlaytest = tasks.register('preparePlaytest') {
    group = 'application'
    description = "Copies the Farmer's Delight jar into the playtest server's and client's mods, and writes a local-only server.properties."
    dependsOn verifyFdJar
    def jar = fdJarFile
    doLast {
        def source = jar.get()
        [new File(playtestDir, 'mods'), devClientMods].each { dir ->
            dir.mkdirs()
            def target = new File(dir, source.name)
            // A running server keeps its jar locked (Windows): leave an identical copy alone, drop only other FD versions
            if (target.isFile() && target.length() == source.length()) {
                return
            }
            (dir.listFiles() ?: []).findAll { it.name.startsWith('FarmersDelight') && it.name.endsWith('.jar') && it.name != source.name }*.delete()
            java.nio.file.Files.copy(source.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        def props = new File(playtestDir, 'server.properties')
        if (!props.exists()) {
            props.text = [
                'server-ip=127.0.0.1', 'online-mode=false', 'motd=Vine & Barrel playtest', 'level-name=world',
                'gamemode=survival', 'difficulty=normal', 'spawn-protection=0', 'view-distance=12', 'simulation-distance=10',
                'allow-flight=true', 'enable-command-block=true', 'white-list=false',
            ].join(System.lineSeparator()) + System.lineSeparator()
        } else {
            // Since 26.x a new server whitelists by default and writes white-list=true into this file on its first start
            // ("You are not white-listed on this server!"). A playtest server this task set up (bound to this computer,
            // offline) lets its local players in; any other server.properties is left exactly as it is
            def lines = props.readLines()*.trim()
            if (lines.contains('server-ip=127.0.0.1') && lines.contains('online-mode=false') && lines.contains('white-list=true')) {
                props.text = props.readLines().collect { it.trim() == 'white-list=true' ? 'white-list=false' : it }.join(System.lineSeparator()) + System.lineSeparator()
            }
        }
    }
}
tasks.matching { it.name == 'runPlaytest' || it.name == 'runPlaytestClient' }.configureEach {
    dependsOn preparePlaytest
}

tasks.register('gameTestsAll') {
    group = 'verification'
    description = "Runs the NeoForge GameTests without and with Farmer's Delight, then with the compat mods (runGameTestServer, runGameTestServerFd, runGameTestServerCompat)."
    dependsOn 'runGameTestServer', 'runGameTestServerFd', 'runGameTestServerCompat'
}
tasks.matching { it.name == 'runGameTestServerFd' }.configureEach {
    mustRunAfter 'runGameTestServer'
}
tasks.matching { it.name == 'runGameTestServerCompat' }.configureEach {
    mustRunAfter 'runGameTestServer', 'runGameTestServerFd'
}

// Maintainer dev tooling isn't part of this repository. Where it is checked out as dev/, dev/neoforge.gradle is applied
// here, last, and may add its own source sets, mods, runs and tasks to this project (a run of its own sets its loadedMods).
def devTooling = rootProject.file('dev/neoforge.gradle')
if (devTooling.isFile()) {
    apply from: devTooling
}
