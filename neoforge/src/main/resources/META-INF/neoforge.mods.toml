modLoader = "javafml"
loaderVersion = "${loader_version_range}"
issueTrackerURL = "https://github.com/jexxme/VineAndBarrel/issues"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://jexxme.github.io/VineAndBarrel/"
bannerFile = "banner.png"
iconFile = "icon.png"
logoBlur = false
credits = "Some art, the boiling sounds, and the Brew Kettle, rope-climbing, wild-crop and biome-filter code are adapted from Farmer's Delight by vectorwing (MIT); see NOTICE_farmersdelight.txt."
authors = "${mod_authors}"
description = "${mod_description}"
enumExtensions = "META-INF/enumextensions.json"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Optional: with Farmer's Delight installed, Vine & Barrel plugs into it (stove heat, ropes, rich soil, cooking pot recipes,
# FD drinks in the barrel). 1.3.3 is the first 26.x build (Farmer's Delight Neoforged).
[[dependencies.${mod_id}]]
    modId = "farmersdelight"
    type = "optional"
    versionRange = "[1.3.3,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "jei"
    type = "optional"
    # The kettle's and barrel's recipe pages and their Watch it buttons: everything they use is in JEI's first 26.2 build
    versionRange = "[30.0.0.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "jade"
    type = "optional"
    versionRange = "*"
    ordering = "NONE"
    side = "BOTH"

# Optional: AppleSkin shows the food a drink really gives (wheat beer feeds through its Saturation buff)
[[dependencies.${mod_id}]]
    modId = "appleskin"
    type = "optional"
    versionRange = "*"
    ordering = "NONE"
    side = "BOTH"

# Optional, data only: our drinks quench thirst in Tough As Nails, Homeostatic and Thirst Was Taken 2, and our food has
# nutrients in Nutritional Balance (tags and JSON in common/src/generated/resources, see compat/CompatData)
[[dependencies.${mod_id}]]
    modId = "toughasnails"
    type = "optional"
    versionRange = "*"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "homeostatic"
    type = "optional"
    versionRange = "*"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "thirstwastaken2"
    type = "optional"
    versionRange = "*"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "nutritionalbalance"
    type = "optional"
    versionRange = "*"
    ordering = "NONE"
    side = "BOTH"

# Optional: works as it is, our meals count toward Spice of Life Onion's food variety (tested in the compat run)
[[dependencies.${mod_id}]]
    modId = "solonion"
    type = "optional"
    versionRange = "*"
    ordering = "NONE"
    side = "BOTH"
