name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and static checks (Error Prone MissingOverride, forbidden patterns)
        run: ./gradlew build --console=plain

      - name: Datagen is up to date
        run: |
          ./gradlew runData --console=plain
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "::error::src/generated is out of date. Run ./gradlew runData and commit the result."
            git status --porcelain -- src/generated | head -50
            git diff --stat -- src/generated | tail -20
            exit 1
          fi

      - name: GameTests, headless (gameplay, edge cases, item conservation)
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log

      - name: No errors in the GameTest server log
        run: |
          # A clean run logs no ERROR lines at all. Any ERROR (data that failed to load, a swallowed exception,
          # a broken recipe) fails the build, even when every test passed.
          if grep -E "/ERROR\]" gametest.log; then
            echo "::error::Errors were logged while the GameTests ran (see above)."
            exit 1
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: VineAndBarrel
          path: build/libs/*.jar
          if-no-files-found: error
