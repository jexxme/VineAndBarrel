name: CI

on:
  push:
    # Branches only: a release tag is built and tested by release.yml
    # Not the ci/** branches: those only exist for verify.yml (gh-verify.sh pushes them and deletes them again)
    branches: ['**', '!ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # A pull request from a branch of this repository is already tested by its push; only forks' pull requests run here
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and static checks (Error Prone MissingOverride, forbidden patterns)
        run: ./gradlew build --console=plain

      - name: Datagen is up to date
        run: |
          ./gradlew runData --console=plain
          if [ -n "$(git status --porcelain -- common/src/generated)" ]; then
            echo "::error::common/src/generated is out of date. Run ./gradlew runData and commit the result."
            git status --porcelain -- common/src/generated | head -50
            git diff --stat -- common/src/generated | tail -20
            exit 1
          fi

      - name: GameTests, headless (gameplay, edge cases, item conservation), on NeoForge and on Fabric (also with Farmer's Delight Refabricated, and with the compat mods)
        # NeoForge with Farmer's Delight Neoforged (runGameTestServerFd) stays local for now: that run needs an FD
        # Neoforged jar, and its Modrinth project (8Vb5dzx9) isn't public yet, so its Maven has nothing to fetch.
        run: |
          set -o pipefail
          ./gradlew :neoforge:runGameTestServer :neoforge:runGameTestServerCompat :fabric:runGameTest :fabric:runGameTestFd :fabric:runGameTestCompat --console=plain 2>&1 | tee gametest.log

      - name: No errors in the GameTest server log
        run: |
          # A clean run logs no ERROR lines at all. Any ERROR (data that failed to load, a swallowed exception,
          # a broken recipe) fails the build, even when every test passed.
          if grep -E "/ERROR\]" gametest.log; then
            echo "::error::Errors were logged while the GameTests ran (see above)."
            exit 1
          fi

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: VineAndBarrel
          path: |
            neoforge/build/libs/*.jar
            fabric/build/libs/*.jar
          if-no-files-found: error
