name: Verify

# The merge gate: scripts/multiloader/verify-all.sh on a GitHub runner, smoke clients included (hidden, under Xvfb).
# Started by pushing a branch ci/quick/<name> or ci/full/<name> (what gh-verify.sh does), or by hand: Actions, Verify,
# Run workflow, with a ref and the tier. Quick after each round of changes, full before merging into 26.3 and before
# tagging (see CONTRIBUTING.md).

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to verify (empty = the branch the workflow runs on)
        required: false
        default: ''
      tier:
        description: quick, or full for merges and tags
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}-${{ inputs.ref || '' }}-${{ inputs.tier || '' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A full verify takes about 15 minutes here, quick about 4; the rest is headroom for a slow runner
    timeout-minutes: 90
    env:
      # The hidden smoke clients: software OpenGL on Xvfb, SDL3 over EGL (its GLX path finds no visual on Xvfb, and
      # Minecraft then falls back to Vulkan and logs an ERROR), OpenAL without a sound device
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      SDL_VIDEO_FORCE_EGL: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Tier
        id: tier
        run: |
          tier='${{ inputs.tier }}'
          if [ -z "$tier" ]; then
            case '${{ github.ref_name }}' in ci/full/*) tier=full ;; *) tier=quick ;; esac
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Verify $(git rev-parse --short HEAD), $tier tier"

      - name: Xvfb and Mesa for the hidden clients, flite for the narrator (without it Minecraft logs an ERROR)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libegl1 libflite1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Farmer's Delight Neoforged, from its GitHub releases (the newest for this Minecraft version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          tag=$(gh release list -R jexxme/FarmersDelight-Neoforged --limit 100 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"$mc-\"))] | sort_by(.createdAt) | last | .tagName")
          [ -n "$tag" ] && [ "$tag" != null ] || { echo "::error::No Farmer's Delight Neoforged release for Minecraft $mc"; exit 1; }
          mkdir -p "$RUNNER_TEMP/fd"
          gh release download "$tag" -R jexxme/FarmersDelight-Neoforged -p 'FarmersDelight*.jar' -D "$RUNNER_TEMP/fd"
          jar=$(ls "$RUNNER_TEMP"/fd/FarmersDelight*.jar | grep -v -- -sources | head -1)
          echo "FD_JAR=$jar" >> "$GITHUB_ENV"
          echo "Farmer's Delight Neoforged $tag: $(basename "$jar")"
          # FD Refabricated comes from Modrinth's Maven through the Fabric build, nothing to fetch here

      - name: The Minecraft EULA for the smoke-test server
        # Jexxme accepts the EULA for local dev/test servers; the folder is gitignored, nothing is committed
        run: mkdir -p fabric/run/server-smoke && printf 'eula=true\n' > fabric/run/server-smoke/eula.txt

      - name: verify-all.sh --${{ steps.tier.outputs.tier }}
        run: |
          set -o pipefail
          mkdir -p build/verify-all
          # An older commit (a ref by hand) whose verify-all.sh has no tiers yet: that one always runs everything
          tier=--${{ steps.tier.outputs.tier }}
          grep -q -- '--quick' scripts/multiloader/verify-all.sh || tier=
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' \
            bash scripts/multiloader/verify-all.sh $tier 2>&1 | tee build/verify-all/output.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Verify, ${{ steps.tier.outputs.tier }} tier, $(git rev-parse --short HEAD)"
            echo '```'
            sed -n '/^Times (games/,$p' build/verify-all/output.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^Times (games/,$p' build/verify-all/output.log > build/verify-all/summary.txt 2>/dev/null || true

      - name: Upload the results (summary, logs, smoke screenshots, PARITY.md)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ steps.tier.outputs.tier }}
          path: |
            build/verify-all/
            PARITY.md
            neoforge/run*/logs/latest.log
            neoforge/run*/crash-reports/
            fabric/run*/logs/latest.log
            fabric/run*/crash-reports/
            fabric/run/*/logs/latest.log
            fabric/run/*/crash-reports/
            fabric/run/*/smoke/
            fabric/run/server-smoke/smoke*/
            fabric/build/*.out
          if-no-files-found: warn
          retention-days: 14
