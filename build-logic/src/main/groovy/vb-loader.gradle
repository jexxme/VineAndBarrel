// A loader project (forge, fabric): compiles the common sources into its own jar, with its own glue code on top.
// The common project hands over its source folders (not a jar), so each loader compiles everything in one go and the
// IDE still sees every file in exactly one module (the MultiLoader-Template way).
plugins {
    id 'vb-java'
}

base {
    archivesName = "VineAndBarrel" // the version tells the loaders apart: VineAndBarrel-26.3-0.9.0+fabric.1.jar
}

configurations {
    commonJava { canBeResolved = true; canBeConsumed = false }
    commonResources { canBeResolved = true; canBeConsumed = false }
}

dependencies {
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

// This older-Minecraft branch only: structure templates are saved by 26.3, whose block states read {id, properties};
// this Minecraft reads {Name, Properties} and would load every block as air. The source .nbt files stay exactly as on
// 26.3 (so structure changes cherry-pick cleanly) and the jar gets converted copies: the palette keys renamed, sign
// text as this Minecraft reads it, and item frames where 26.3 has shelves (see BackportNbt).
def structureNbt = project(':common').fileTree('src/main/resources') { include 'data/*/structures/**/*.nbt' }
def downgradedStructures = layout.buildDirectory.dir('backport/structures')
def downgradeStructures = tasks.register('downgradeStructures') {
    group = 'build'
    description = 'Converts the 26.3 structure templates to the block state format of this Minecraft version.'
    def sources = structureNbt
    def resourcesRoot = project(':common').file('src/main/resources')
    def out = downgradedStructures
    inputs.files(sources)
    outputs.dir(out)
    doLast {
        def target = out.get().asFile
        target.deleteDir()
        sources.each { File source ->
            def rel = resourcesRoot.toPath().relativize(source.toPath()).toString()
            BackportNbt.downgrade(source, new File(target, rel))
        }
    }
}

tasks.named('processResources', ProcessResources) {
    dependsOn(configurations.commonResources)
    from(downgradeStructures)
    from(configurations.commonResources) {
        exclude 'data/*/structures/**/*.nbt' // converted copies come from downgradeStructures
        exclude '.cache'
        // Each loader ships only its own access file: the access transformer on Forge (forge/build.gradle leaves it out
        // when it has no entries), the class tweaker on Fabric
        exclude(project.name == 'fabric' ? 'META-INF/accesstransformer.cfg' : 'vineandbarrel.classtweaker')
        // Forge's global loot modifiers stay out of the Fabric jar and its dev runs (Porting Lib, which Farmer's Delight
        // Refabricated carries, tries to decode them and warns on every data load). The rest of the Forge-named data
        // stays in: our own tags are built on the forge: tags (data/forge/tags), and FabricWildCrops reads the biome
        // modifier files (data/vineandbarrel/forge/biome_modifier) on Fabric.
        if (project.name == 'fabric') {
            exclude 'data/forge/loot_modifiers/**', 'data/vineandbarrel/loot_modifiers/**'
        }
    }
}

// The wiki exporter is dev-only (runDocsExport); it never ships in a jar. (On Forge the shipped jar is reobfJar's, made
// from this jar task's output, so everything set on the jar task here is in it too.)
tasks.named('jar', Jar) {
    exclude 'jexxme/vineandbarrel/gametest/VBDocsExport*'
}

// Ship our MIT license and the Farmer's Delight MIT notice (for the FD art we use) inside the jar
tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE_vineandbarrel' }
    }
    from(rootProject.file('NOTICE_farmersdelight.txt'))
}

// The metadata files (mods.toml, fabric.mod.json) get the mod's properties from gradle.properties
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            fabric_loader_version  : fabric_loader_version,
            fabric_loader_min_version: fabric_loader_min_version,
            // Fabric API's own version without the "+26.3" build suffix, for fabric.mod.json's "depends"
            fabric_api_min_version : fabric_api_version.tokenize('+')[0],
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : loaderModVersion,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'fabric.mod.json']) {
        expand replaceProperties
    }
}

// At most two games at once across both loaders (GameTest servers, smoke clients; Gradle runs tasks in parallel), so
// a whole verify run fits next to everything else on the machine. One service for the whole build (VbGameSlots).
def gameSlots = gradle.sharedServices.registerIfAbsent('vbGameSlots', VbGameSlots) {
    maxParallelUsages = 2
}
tasks.withType(JavaExec).configureEach { task ->
    if (task.name.startsWith('run')) {
        task.usesService(gameSlots)
    }
}
