// A loader project (neoforge, fabric): compiles the common sources into its own jar, with its own glue code on top.
// The common project hands over its source folders (not a jar), so each loader compiles everything in one go and the
// IDE still sees every file in exactly one module (the MultiLoader-Template way).
plugins {
    id 'vb-java'
}

base {
    archivesName = "VineAndBarrel" // the version tells the loaders apart: VineAndBarrel-26.3-0.9.0+fabric.1.jar
}

configurations {
    commonJava { canBeResolved = true; canBeConsumed = false }
    commonResources { canBeResolved = true; canBeConsumed = false }
}

dependencies {
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

// This older-Minecraft branch only: structure templates are saved by 26.3, whose block states read {id, properties};
// this Minecraft reads {Name, Properties} and would load every block as air. The source .nbt files stay exactly as on
// 26.3 (so structure changes cherry-pick cleanly) and the jar gets converted copies: only the palette keys are renamed.
def structureNbt = project(':common').fileTree('src/main/resources') { include 'data/*/structure/**/*.nbt' }
def downgradedStructures = layout.buildDirectory.dir('backport/structures')
def downgradeStructures = tasks.register('downgradeStructures') {
    group = 'build'
    description = 'Converts the 26.3 structure templates to the block state format of this Minecraft version.'
    def sources = structureNbt
    def resourcesRoot = project(':common').file('src/main/resources')
    def out = downgradedStructures
    inputs.files(sources)
    outputs.dir(out)
    doLast {
        def target = out.get().asFile
        target.deleteDir()
        sources.each { File source ->
            def rel = resourcesRoot.toPath().relativize(source.toPath()).toString()
            BackportNbt.downgrade(source, new File(target, rel))
        }
    }
}

tasks.named('processResources', ProcessResources) {
    dependsOn(configurations.commonResources)
    from(downgradeStructures)
    from(configurations.commonResources) {
        exclude 'data/*/structure/**/*.nbt' // converted copies come from downgradeStructures
        exclude '.cache'
        // Each loader ships only its own access file: the access transformer on NeoForge, the class tweaker on Fabric
        exclude(project.name == 'fabric' ? 'META-INF/accesstransformer.cfg' : 'vineandbarrel.classtweaker')
    }
}

// The wiki exporter is dev-only (runDocsExport); it never ships in a jar
tasks.named('jar', Jar) {
    exclude 'jexxme/vineandbarrel/gametest/VBDocsExport*'
}

// Ship our MIT license and the Farmer's Delight MIT notice (for the FD art we use) inside the jar
tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE_vineandbarrel' }
    }
    from(rootProject.file('NOTICE_farmersdelight.txt'))
}

// The metadata files (neoforge.mods.toml, fabric.mod.json) get the mod's properties from gradle.properties
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            fabric_loader_version  : fabric_loader_version,
            // Fabric API's own version without the "+26.3" build suffix, for fabric.mod.json's "depends"
            fabric_api_min_version : fabric_api_version.tokenize('+')[0],
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : loaderModVersion,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json']) {
        expand replaceProperties
    }
}

// At most two games at once across both loaders (GameTest servers, smoke clients; Gradle runs tasks in parallel), so
// a whole verify run fits next to everything else on the machine. One service for the whole build (VbGameSlots).
def gameSlots = gradle.sharedServices.registerIfAbsent('vbGameSlots', VbGameSlots) {
    maxParallelUsages = 2
}
tasks.withType(JavaExec).configureEach { task ->
    if (task.name.startsWith('run')) {
        task.usesService(gameSlots)
    }
}

// Another mod next to this one, for a one-off "does it still work with mod X installed" check:
//   ./gradlew :fabric:runGameTest -Pwith=kaleidoscope-tavern-refabricated:<version>,forge-config-api-port:<version>
// A mod is a Modrinth project and version (<project>:<version number or id>, from Modrinth's Maven) or any
// group:name:version. The GameTest runs (with and without Farmer's Delight) and the first smoke client get the jars as a
// player installs them: in the run's mods folder, nested libraries and all (as a dev dependency those are missing). The
// next run without -Pwith takes them out again. Forge 1.20.1 runs on other names than the jars: there they are
// remapped onto the run's classpath instead. -Pwith.java=<version> runs these games on another Java (a mod built for a
// newer Java than this Minecraft's). Never in a jar, a compile classpath or the merge gate.
def withMods = providers.gradleProperty('with').map { String list -> list.split(',')*.trim().findAll { it } }.getOrElse([])
def withJava = providers.gradleProperty('with.java').orNull
def withRuns = ['runGameTestServer', 'runGameTestServerFd', 'runGameTest', 'runGameTestFd', 'runSmokeClient']
def withConfiguration = configurations.create('withMods') {
    canBeConsumed = false
    transitive = false
    description = 'The mods -Pwith puts next to this one in the GameTest runs and the first smoke client.'
}
def withCoordinates = withMods.collect { String mod -> mod.count(':') >= 2 ? mod : "maven.modrinth:${mod}" }
def forgeNames = project.name == 'forge'
if (!forgeNames) {
    withCoordinates.each { dependencies.add('withMods', it) }
} else if (withMods) {
    // the remapping configuration (modWithMods) takes the published jars and hands withMods their remapped copies
    pluginManager.withPlugin('net.neoforged.moddev.legacyforge') {
        obfuscation.createRemappingConfiguration(configurations.withMods)
        withCoordinates.each { dependencies.add('modWithMods', it) }
        configurations.named('runtimeClasspath') { extendsFrom(configurations.withMods) }
    }
}
def withJars = withConfiguration
tasks.withType(JavaExec).matching { it.name in withRuns }.configureEach { JavaExec run ->
    if (withJava) run.javaLauncher = project.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(withJava as int) }
    def jars = forgeNames ? files() : withJars
    def names = withMods
    // The run's game folder (Loom sets the task's working folder only as the game starts)
    def runName = run.name.substring(3, 4).toLowerCase() + run.name.substring(4)
    def loomRun = project.extensions.findByName('loom')?.runConfigs?.findByName(runName)
    def mdgRun = project.extensions.findByName('neoForge')?.runs?.findByName(runName)
    def gameDir = loomRun != null ? project.file(loomRun.runDir) : mdgRun != null ? mdgRun.gameDirectory.get().asFile : run.workingDir
    doFirst { JavaExec task ->
        def mods = new File(gameDir, 'mods')
        def marker = new File(mods, 'with-mods.txt')
        if (marker.isFile()) {
            marker.readLines().findAll { it }.each { new File(mods, it).delete() }
            marker.delete()
        }
        def added = jars.files
        if (added) {
            mods.mkdirs()
            added.each { java.nio.file.Files.copy(it.toPath(), new File(mods, it.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING) }
            marker.text = added*.name.join('\n') + '\n'
        }
        if (names) task.logger.lifecycle("With: ${names.join(', ')} ${added ? "in ${mods}" : '(on the classpath, remapped)'}")
    }
}
