// Everything that only needs vanilla Minecraft: blocks, items, recipes, block entities, Tipsy, worldgen data, the
// mixins, the JEI and Jade plugins and the GameTests. Compiled here against vanilla (NeoForm, no NeoForge) so nothing
// loader-specific can creep in; the loader projects compile these sources again into their own jars.
// Loader-specific calls go through jexxme.vineandbarrel.platform.Services.
plugins {
    id 'vb-java'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // The same access transformer as on NeoForge; Fabric gets the same access from vineandbarrel.classtweaker
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg').absolutePath)
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude('.cache')
}

dependencies {
    // Both loaders ship Fabric's Mixin and MixinExtras, so the shared mixins compile against them
    compileOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.3'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.3'

    // JEI and Jade: optional, their plugins only load with them (see compat/jei and compat/jade)
    compileOnly "mezz.jei:jei-${jei_minecraft}-common-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
}

configurations {
    commonJava { canBeResolved = false; canBeConsumed = true }
    commonResources { canBeResolved = false; canBeConsumed = true }
}

artifacts {
    commonJava file('src/main/java')
    commonResources file('src/main/resources')
    commonResources file('src/generated/resources')
}

// Every language file has every en_us key, the same placeholders and no keys en_us dropped. A key that is new in
// en_us and not translated yet goes into lang-pending.txt (one key per line) until the next translation pass; the
// game shows the English text for it meanwhile. Run with `./gradlew check` (part of build).
tasks.register('checkLang') {
    group = 'verification'
    description = 'Fails when a language file misses an en_us key (unless listed in common/lang-pending.txt), has a key en_us no longer has, or changes placeholders.'
    def langDir = file('src/main/resources/assets/vineandbarrel/lang')
    def pendingFile = file('lang-pending.txt')
    inputs.dir(langDir)
    inputs.file(pendingFile)
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def read = { File f -> slurper.parse(f, 'UTF-8') as Map<String, Object> }
        // %s, %1$s, %d and %%, counted; section-sign format codes
        def codes = { String s ->
            def found = []
            (s =~ /%(?:\d+\$)?[sd%]|\u00a7./).each { found << it }
            found.countBy { it }
        }
        def english = read(new File(langDir, 'en_us.json'))
        def pending = pendingFile.readLines('UTF-8').collect { it.trim() }.findAll { it && !it.startsWith('#') } as Set
        def problems = []
        pending.findAll { !english.containsKey(it) }.each { problems << "lang-pending.txt: ${it} is not in en_us.json any more" }
        def locales = langDir.listFiles().findAll { it.name.endsWith('.json') && it.name != 'en_us.json' }.sort { it.name }
        if (locales.isEmpty()) problems << "no language files besides en_us.json in ${langDir}"
        locales.each { File f ->
            def lang = read(f)
            def missing = english.keySet().findAll { !lang.containsKey(it) && !pending.contains(it) }
            if (missing) problems << "${f.name}: ${missing.size()} en_us keys missing (translate them, or list them in common/lang-pending.txt until the next translation pass):\n      " + missing.join('\n      ')
            def extra = lang.keySet().findAll { !english.containsKey(it) }
            if (extra) problems << "${f.name}: keys en_us no longer has: ${extra.join(', ')}"
            lang.each { k, v ->
                if (english.containsKey(k) && codes(english[k] as String) != codes(v as String)) {
                    problems << "${f.name}: ${k}: placeholders or format codes differ from en_us (\"${english[k]}\" vs \"${v}\")"
                }
            }
        }
        if (!problems.isEmpty()) throw new GradleException("Language files (${langDir}):\n  " + problems.join('\n  '))
        logger.lifecycle("checkLang: ${locales.size()} languages, ${english.size()} keys" + (pending ? ", ${pending.size()} pending" : ''))
    }
}

tasks.named('check') {
    dependsOn 'checkLang'
}
