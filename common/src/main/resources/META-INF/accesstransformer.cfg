# M6 World: add our buildings to the vanilla village pools and our crops to the village farm processors, exactly like
# Farmer's Delight (VillageStructures). The pools and processor lists are mutated once per server start.
public-f net.minecraft.world.level.levelgen.structure.pools.StructureTemplatePool rawTemplates # rawTemplates
public net.minecraft.world.level.levelgen.structure.pools.StructureTemplatePool templates  # templates
public-f net.minecraft.world.level.levelgen.structure.templatesystem.StructureProcessorList list # list

# Our blocks burn through vanilla's own fire table (VBFlammability), read by both loaders
public net.minecraft.world.level.block.FireBlock setFlammable(Lnet/minecraft/world/level/block/Block;II)V # setFlammable
public net.minecraft.world.level.block.FireBlock getBurnOdds(Lnet/minecraft/world/level/block/state/BlockState;)I # getBurnOdds
public net.minecraft.world.level.block.FireBlock getIgniteOdds(Lnet/minecraft/world/level/block/state/BlockState;)I # getIgniteOdds

# Access NeoForge opens up and the common code compiles against vanilla with (NeoForm)
public net.minecraft.world.entity.Mob goalSelector # goalSelector (the fox learns to pick grapes)
public net.minecraft.world.item.crafting.RecipeManager recipes # recipes (AgingRecipes caches per recipe map)
public net.minecraft.world.item.CreativeModeTab$Output
public net.minecraft.client.gui.screens.recipebook.GhostSlots setInput(Lnet/minecraft/world/inventory/Slot;Lnet/minecraft/util/context/ContextMap;Lnet/minecraft/world/item/crafting/display/SlotDisplay;)V # setInput

# Blackout: the villager whose bed you woke up in shakes its head (vanilla's own "no", as when it won't trade), and a
# blacked-out player's movement keys are held still on the client
public net.minecraft.world.entity.npc.villager.Villager setUnhappy()V # setUnhappy
public net.minecraft.client.player.ClientInput moveVector # moveVector
