# Forge only. On Minecraft 1.20.1 nothing needs an access transformer, so this file has no entries (forge/build.gradle
# then neither applies nor packs it). What the common code reaches in vanilla (village pools and processor lists, the
# fire table, a mob's goals, the dispenser's behaviours, the advancement triggers) goes through mixin accessors in
# jexxme.vineandbarrel.mixin, the same on both loaders. The Forge glue needs none either: the block entity factory
# interface (BlockEntityType$BlockEntitySupplier) is opened by Forge's own access transformer, and the trellis frame
# bakes its turned pieces with a baker of its own (TrellisFrameModel) instead of ModelBakery$ModelBakerImpl.
#
# If an entry is ever needed: Forge reads fields and methods by their SRG names (build/port/forge-build-notes.md says
# where to look them up); a class or a constructor is written as it is.
