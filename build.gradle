plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'net.ltgt.errorprone' version '5.2.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = 'jexxme.vineandbarrel'

repositories {
    maven {
        // JEI: BlameJared's Maven, which Farmer's Delight Neoforged also lists (the Progwml6 Maven has no 26.x builds)
        name = "BlameJared"
        url = "https://maven.blamejared.com"
        content { includeGroup "mezz.jei"; includeGroup "net.mezzdev.config" }
    }
    exclusiveContent {
        // Jade, from Modrinth's Maven
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude(".cache")
}

// Test-only data for the GameTest server run only (see neoForge.mods), never packed into the jar. It stands in for optional mods, e.g. it puts
// a vanilla block into #farmersdelight:ropes so rope climbing is tested without Farmer's Delight on the classpath.
sourceSets {
    gametest // resources in src/gametest/resources
}

base {
    archivesName = 'VineAndBarrel'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // Two views of the same mod (one mods.toml): the real one, and one with the test-only data from src/gametest on
    // top. Only the GameTest server loads the second, so dev clients and servers play exactly what the jar ships.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_gametest" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Headless: boots a GameTest server, runs every test of this mod, exits. No window, safe to run any time.
        // This is THE test entry point, locally and in CI: ./gradlew runGameTestServer
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // The same GameTests with Farmer's Delight installed: ./gradlew runGameTestServerFd (headless too). FD is never on
        // the compile classpath; its jar is copied into this run's own mods folder (run-fd/mods), so the normal
        // gameTestServer run stays FD-free. Every FD hook is tested in both runs (see FdCompatGameTests).
        gameTestServerFd {
            type = "gameTestServer"
            gameDirectory = project.file('run-fd')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'vineandbarrel.expectFd', 'true' // fd_run_has_the_right_mods fails if FD did not load
        }

        // Writes the runtime values the wiki reads (site/src/data/runtime.json): ./gradlew runDocsExport. Headless.
        // Only the exporter runs there (see VBDocsExport), so it never appears in the normal GameTest results.
        docsExport {
            type = "gameTestServer"
            gameDirectory = project.file('run/docs-export')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'vineandbarrel.docsExport', file('site/src/data/runtime.json').getAbsolutePath()
        }

        // A local playtest server: ./gradlew runPlaytest. Farmer's Delight, JEI and Jade loaded, the showcase world, bound
        // to 127.0.0.1 in offline mode. Join with ./gradlew runPlaytestClient (its own folder with FD, so the FD-free
        // GameTest run in run/ never sees FD) or any NeoForge client with the same mods. See preparePlaytest.
        playtest {
            server()
            gameDirectory = project.file('run/playtest')
            programArgument '--nogui'
        }

        playtestClient {
            client()
            gameDirectory = project.file('run/playtest-client')
            programArguments.addAll '--username', 'Jexxme', '--quickPlayMultiplayer', '127.0.0.1:25565'
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file(project.findProperty('datagenOutput') ?: 'src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach { run ->
            loadedMods = run.name.startsWith('gameTestServer') ? [neoForge.mods.named("${mod_id}_gametest").get()]
                    : [neoForge.mods.named(mod_id).get()]
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Static analysis, see the "Guards" section at the end of this file
    errorprone "com.google.errorprone:error_prone_core:2.52.0"

    // JEI and Jade: optional at runtime. Their APIs are compile-only; the integrations live in compat/jei and compat/jade,
    // which only those mods load (@JeiPlugin, @WailaPlugin). Both are in every dev run, so the GameTest runs boot with them.
    compileOnly "mezz.jei:jei-${jei_minecraft}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${jei_minecraft}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
}

// The Farmer's Delight jar for runGameTestServerFd, a built FD Neoforged jar (MIT). Pass -PfdJar=<path> or set FD_JAR;
// otherwise the build output of the FD Neoforged project next to this one (../Season4/farmersdelight-port, also found
// from a worktree under .claude/worktrees) is used. Run it with `./gradlew runGameTestServerFd`, or both runs with
// `./gradlew gameTestsAll`.
def fdProjectDir = projectDir // plain values only: these closures also run at execution time (configuration cache)
def fdRootDir = rootDir
def fdJarFile = providers.gradleProperty('fdJar').orElse(providers.environmentVariable('FD_JAR')).map { String path ->
    def jar = new File(path)
    jar.isAbsolute() ? jar : new File(fdProjectDir, path)
}.orElse(provider {
    def roots = [fdRootDir.parentFile, fdRootDir.parentFile?.parentFile?.parentFile?.parentFile].findAll { it != null }
    def found = roots.collect { new File(it, 'Season4/farmersdelight-port/build/libs') }
            .findAll { it.isDirectory() }
            .collectMany { dir -> (dir.listFiles() ?: []).findAll { it.name.startsWith('FarmersDelight') && it.name.endsWith('.jar') && !it.name.contains('-sources') } }
            .sort { -it.lastModified() }
    found ? found.first() : new File(fdProjectDir, 'fd-jar-not-found.jar')
})

// Always runs (no inputs or outputs), so a missing jar fails the FD run with this message. A check inside the Sync
// below would be skipped: Gradle skips a Sync with no source files (NO-SOURCE), and the server would start without FD.
def verifyFdJar = tasks.register('verifyFdJar') {
    group = 'verification'
    description = "Fails unless the Farmer's Delight jar for runGameTestServerFd exists."
    def jar = fdJarFile
    doLast {
        if (!jar.get().isFile()) {
            throw new GradleException("No Farmer's Delight jar for the FD GameTest run: ${jar.get()}. Build FD Neoforged (./gradlew jar there) or pass -PfdJar=<path to the jar>.")
        }
    }
}

def prepareFdRun = tasks.register('prepareFdRun', Sync) {
    group = 'verification'
    description = "Copies the Farmer's Delight jar into run-fd/mods for runGameTestServerFd."
    dependsOn verifyFdJar
    from(fdJarFile)
    into(layout.projectDirectory.dir('run-fd/mods'))
}

tasks.matching { it.name == 'runGameTestServerFd' }.configureEach {
    dependsOn prepareFdRun
}

// The playtest server and the dev client both need FD (it adds registries). server.properties is only written once, so
// changes made for a playtest stay; the EULA is never accepted here, that is the player's own call (run/playtest/eula.txt).
def playtestDir = project.file('run/playtest')
def devClientMods = project.file('run/playtest-client/mods')
def preparePlaytest = tasks.register('preparePlaytest') {
    group = 'application'
    description = "Copies the Farmer's Delight jar into the playtest server's and client's mods, and writes a local-only server.properties."
    dependsOn verifyFdJar
    def jar = fdJarFile
    doLast {
        def source = jar.get()
        [new File(playtestDir, 'mods'), devClientMods].each { dir ->
            dir.mkdirs()
            def target = new File(dir, source.name)
            // A running server keeps its jar locked (Windows): leave an identical copy alone, drop only other FD versions
            if (target.isFile() && target.length() == source.length()) {
                return
            }
            (dir.listFiles() ?: []).findAll { it.name.startsWith('FarmersDelight') && it.name.endsWith('.jar') && it.name != source.name }*.delete()
            java.nio.file.Files.copy(source.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        def props = new File(playtestDir, 'server.properties')
        if (!props.exists()) {
            props.text = [
                'server-ip=127.0.0.1', 'online-mode=false', 'motd=Vine & Barrel playtest', 'level-name=world',
                'gamemode=survival', 'difficulty=normal', 'spawn-protection=0', 'view-distance=12', 'simulation-distance=10',
                'allow-flight=true', 'enable-command-block=true',
            ].join(System.lineSeparator()) + System.lineSeparator()
        }
    }
}
tasks.matching { it.name == 'runPlaytest' || it.name == 'runPlaytestClient' }.configureEach {
    dependsOn preparePlaytest
}

tasks.register('gameTestsAll') {
    group = 'verification'
    description = "Runs the GameTests without and with Farmer's Delight (runGameTestServer, then runGameTestServerFd)."
    dependsOn 'runGameTestServer', 'runGameTestServerFd'
}
tasks.matching { it.name == 'runGameTestServerFd' }.configureEach {
    mustRunAfter 'runGameTestServer'
}

// The wiki exporter is dev-only (runDocsExport); it never ships in the jar
tasks.named('jar', Jar) {
    exclude 'jexxme/vineandbarrel/gametest/VBDocsExport*'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
    options.fork = true
    options.forkOptions.jvmArgs += ['-Duser.language=en', '-Duser.country=US']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Ship our MIT license and the Farmer's Delight MIT notice (for the FD art we use) inside the jar
tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { 'LICENSE_vineandbarrel' }
    }
    from('NOTICE_farmersdelight.txt')
}


//////////////// Guards (carried over from Farmer's Delight Neoforged, where each one caught a real bug)
// Run with `./gradlew check`.

// Every method that overrides something must say @Override, so a renamed or removed Minecraft hook fails the build.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableAllChecks = true
        error('MissingOverride')
    }
}

// Code patterns that compile fine but were real bugs in the FD 26.x port. Suppress a deliberate use with a
// trailing `// guard:allow <rule>` comment on the same line.
def forbiddenPatterns = [
    [rule: 'bare-toStack',
     regex: ~/\.toStack\(\)/,
     why: 'ItemResource#toStack() is a COPY with count 1. Use toStack(handler.getAmountAsInt(slot)) and write changes back with handler.set(...).'],
    [rule: 'empty-ingredient',
     regex: ~/Ingredient\.of\(\s*\)/,
     why: 'An empty Ingredient throws in 26.x (also when decoded on the client). Use Optional/empty lists instead.'],
    [rule: 'empty-identity',
     regex: ~/[=!]=\s*ItemStack\.EMPTY|ItemStack\.EMPTY\s*[=!]=/,
     why: 'Empty stacks are not always the ItemStack.EMPTY instance (copyWithCount(0), split, shrink). Use isEmpty().'],
    [rule: 'removed-hook-onRemove',
     regex: ~/\bvoid\s+onRemove\s*\(/,
     why: 'Block#onRemove no longer exists in 26.x. Drop contents in BlockEntity#preRemoveSideEffects, update neighbours in Block#affectNeighborsAfterRemoval.'],
]

tasks.register('checkForbiddenPatterns') {
    group = 'verification'
    description = 'Fails on code patterns that caused bugs in 26.x mods (see build.gradle).'
    def sources = fileTree('src/main/java') { include '**/*.java' }
    def root = projectDir.toPath()
    def patterns = forbiddenPatterns
    inputs.files(sources)
    doLast {
        def problems = []
        sources.each { File file ->
            def lines = file.readLines('UTF-8')
            def rel = root.relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
            lines.eachWithIndex { String line, int i ->
                def code = line.replaceFirst(/\/\/.*$/, '')
                patterns.each { p ->
                    if (code =~ p.regex && !line.contains("guard:allow ${p.rule}")) {
                        problems << "${rel}:${i + 1}: [${p.rule}] ${line.trim()}\n    ${p.why}"
                    }
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Forbidden patterns found (${problems.size()}):\n" + problems.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn 'checkForbiddenPatterns'
}


//////////////// Backport (this branch only, not on 26.3)

// Structure templates are saved by 26.3, whose block states read {id, properties}; this Minecraft reads {Name,
// Properties} and would load every block as air. The source .nbt files stay exactly as on 26.3 (so structure changes
// cherry-pick cleanly) and processResources writes converted copies: only the palette keys are renamed.
def structureNbt = fileTree('src/main/resources') { include 'data/*/structure/**/*.nbt' }
def downgradedStructures = layout.buildDirectory.dir('backport/structures')
def downgradeStructures = tasks.register('downgradeStructures') {
    group = 'build'
    description = 'Converts the 26.3 structure templates to the block state format of this Minecraft version.'
    def sources = structureNbt
    def resourcesRoot = file('src/main/resources')
    def out = downgradedStructures
    inputs.files(sources)
    outputs.dir(out)
    doLast {
        def target = out.get().asFile
        target.deleteDir()
        sources.each { File source ->
            def rel = resourcesRoot.toPath().relativize(source.toPath()).toString()
            def tag = BackportNbt.read(source)
            def root = tag.value as BackportNbt.CompoundView
            def palettes = []
            if (root.containsKey('palette')) palettes << root.get('palette').value
            if (root.containsKey('palettes')) palettes.addAll((root.get('palettes').value as BackportNbt.TagList).items)
            palettes.each { BackportNbt.TagList palette ->
                palette.items.each { BackportNbt.CompoundView state ->
                    if (state.containsKey('id') && !state.containsKey('Name')) state.put('Name', state.remove('id'))
                    if (state.containsKey('properties') && !state.containsKey('Properties')) state.put('Properties', state.remove('properties'))
                }
            }
            def file = new File(target, rel)
            file.parentFile.mkdirs()
            BackportNbt.write(tag, file)
        }
    }
}
def originalStructures = file('src/main/resources/data').absolutePath
tasks.named('processResources', ProcessResources).configure {
    from(downgradeStructures)
    eachFile { details ->
        if (details.name.endsWith('.nbt') && details.file.absolutePath.startsWith(originalStructures)) details.exclude()
    }
}

/** Just enough NBT (gzip, big-endian) to read a structure template and write it back with every tag type kept. */
class BackportNbt
{
    static class Tag { int type; Object value; Tag(int type, Object value) { this.type = type; this.value = value } }
    static class TagList { int elementType; List<Object> items; TagList(int t, List<Object> i) { elementType = t; items = i } }

    static Tag read(File file) {
        new DataInputStream(new BufferedInputStream(new java.util.zip.GZIPInputStream(new FileInputStream(file)))).withCloseable { input ->
            int type = input.readUnsignedByte()
            input.readUTF()
            new Tag(type, payload(input, type))
        }
    }

    static void write(Tag tag, File file) {
        new DataOutputStream(new BufferedOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(file)))).withCloseable { output ->
            output.writeByte(tag.type)
            output.writeUTF('')
            writePayload(output, tag.type, tag.value)
        }
    }

    // Compounds are CompoundViews (name -> Tag), lists are TagLists
    private static Object payload(DataInputStream input, int type) {
        switch (type) {
            case 1: return input.readByte()
            case 2: return input.readShort()
            case 3: return input.readInt()
            case 4: return input.readLong()
            case 5: return input.readFloat()
            case 6: return input.readDouble()
            case 7: def bytes = new byte[input.readInt()]; input.readFully(bytes); return bytes
            case 8: return input.readUTF()
            case 9:
                int elementType = input.readUnsignedByte()
                int count = input.readInt()
                def items = []
                count.times { items << payload(input, elementType) }
                return new TagList(elementType, items)
            case 10:
                def map = new LinkedHashMap<String, Tag>()
                while (true) {
                    int childType = input.readUnsignedByte()
                    if (childType == 0) return new CompoundView(map)
                    String name = input.readUTF()
                    map.put(name, new Tag(childType, payload(input, childType)))
                }
            case 11: int n = input.readInt(); def ints = new int[n]; n.times { ints[it] = input.readInt() }; return ints
            case 12: int n = input.readInt(); def longs = new long[n]; n.times { longs[it] = input.readLong() }; return longs
            default: throw new GradleException("Unknown NBT tag type ${type}")
        }
    }

    private static void writePayload(DataOutputStream output, int type, Object value) {
        switch (type) {
            case 1: output.writeByte(value as byte); break
            case 2: output.writeShort(value as short); break
            case 3: output.writeInt(value as int); break
            case 4: output.writeLong(value as long); break
            case 5: output.writeFloat(value as float); break
            case 6: output.writeDouble(value as double); break
            case 7: byte[] bytes = value as byte[]; output.writeInt(bytes.length); output.write(bytes); break
            case 8: output.writeUTF(value as String); break
            case 9:
                TagList list = value as TagList
                output.writeByte(list.elementType)
                output.writeInt(list.items.size())
                list.items.each { writePayload(output, list.elementType, it) }
                break
            case 10:
                (value as CompoundView).@tags.each { String name, Tag child ->
                    output.writeByte(child.type)
                    output.writeUTF(name)
                    writePayload(output, child.type, child.value)
                }
                output.writeByte(0)
                break
            case 11: int[] ints = value as int[]; output.writeInt(ints.length); ints.each { output.writeInt(it) }; break
            case 12: long[] longs = value as long[]; output.writeInt(longs.length); longs.each { output.writeLong(it) }; break
            default: throw new GradleException("Unknown NBT tag type ${type}")
        }
    }

    /** A compound; renaming a key keeps its tag (type and value). */
    static class CompoundView extends AbstractMap<String, Tag>
    {
        final LinkedHashMap<String, Tag> tags
        CompoundView(LinkedHashMap<String, Tag> tags) { this.tags = tags }
        @Override Set<Map.Entry<String, Tag>> entrySet() { this.@tags.entrySet() }
        @Override Tag put(String key, Tag value) { this.@tags.put(key, value) }
        @Override Tag remove(Object key) { this.@tags.remove(key) }
        @Override boolean containsKey(Object key) { this.@tags.containsKey(key) }
        @Override Tag get(Object key) { this.@tags.get(key) }
    }
}

// Maintainer dev tooling isn't part of this repository. Where it is checked out as dev/, dev/neoforge.gradle is applied
// here, last, and may add its own source sets, mods, runs and tasks to this project (a run of its own sets its loadedMods).
def devTooling = rootProject.file('dev/neoforge.gradle')
if (devTooling.isFile()) {
    apply from: devTooling
}
