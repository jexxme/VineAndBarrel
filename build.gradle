plugins {
    // Versions of the loader toolchains, applied in the subprojects
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.fabricmc.fabric-loom' version '1.19.3' apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// The NeoForge GameTests without and with Farmer's Delight, as before the split (the counts CI compares)
tasks.register('gameTestsAll') {
    group = 'verification'
    description = "Runs the NeoForge and the Fabric GameTests, each without and with Farmer's Delight and with the compat mods."
    dependsOn ':neoforge:gameTestsAll', ':fabric:gameTestsAll'
}
